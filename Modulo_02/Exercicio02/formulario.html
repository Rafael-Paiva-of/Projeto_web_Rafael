<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        .formulario{
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }
        header{
            background-color: #1a365d;
            color:#ffffff;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        header h1 {
            margin: o;
            font-size: 24px;
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 5px 10px;
        }
        nav a:hover{
            background-color: #2b6cb0;
            border-radius: 3px;
        }
        h1{
            text-align: center;
        }
        label{
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        innput,
        select,
        textarea{
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        button{
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover{
            background-color: #555;
        }
    </style>
</head>
<body>
        <header>
        <h1>Portal Educacional</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="tabela.html">Grade Horário</a>
            <a href="contato.html">Contato</a>
            <a href="formulario.html"><strong>Formulario</strong></a>
        </nav>
        </header>
    <div class="formulario">
        <h1> Cadastro</h1>
        <form>
            <label for="nome">Nome:</label>
            <input type="text"
                        id="nome"
                        placeholder="Digite seu nome">

            <label for="cidade">Cidade:</label>
            <input type="text"
                        id="cidade"
                        placeholder="Digite sua cidade">

            <label for="tel">Telefone:</label>
            <input type="tel"
                        id="tel"
                        placeholder="Digite seu telefone">

            <label for="email">E-mail:</label>
            <input type="email"
                        id="email"
                        placeholder="digite seu e-mail">
            
            <label for="email">Idade:</label>
            <input type="number"
                        id="idade"
                        placeholder="digite sua idade">

            <label for="sexo">Sexo:</label>
            <input type="radio"
            name="sexo"
            value="masculino">
                Masculino

            <input type="radio"
            name="sexo"
            value="feminino">
                Feminino
            
            <input type="radio"
            name="sexo"
            value="outro">
                Outro

            <label for="curso">Curso:</label>
            <select id="curso">
            <option value="">selecione</option>
            <option value="tds">
                Desenvolvimento de Sistema
            </option>

            <option value="adm">
                Administração
            </option>

            <option value="enfermagem">
                Enfermagem
                
            </option>
            <option value="log">
                Logistica
            </option>

            </select>

            <label for="mensagem">Observação:</label>

            <textarea id="mensagem" 
            rows="4"
            placeholder="Digite uma observação"></textarea>

            <button type="submit">
                Cadastrar
            </button>
            
        </form>
    </div>
</body>
</html>
